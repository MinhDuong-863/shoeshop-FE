<app-header></app-header>
<div class="container">
    <!-- Slideshow container -->
    <div class="slideshow-container">

        <!-- Full-width images with number and caption text -->
        <div class="mySlides fade">
            <img src="https://img.freepik.com/premium-psd/sport-sneakers-shoes-sale-social-media-instagram-post-facebook-web-banner-template_70055-915.jpg?w=1380" style="width:100%; height: 100%px;">
        </div>

        <div class="mySlides fade">
            <img src="https://img.freepik.com/premium-psd/sport-sneakers-shoes-sale-social-media-instagram-post-facebook-web-banner-template_70055-1406.jpg?w=1380" style="width:100%; height: 100%px;">
        </div>

        <div class="mySlides fade">
            <img src="https://img.freepik.com/premium-psd/sport-sneakers-shoes-sale-social-media-instagram-post-facebook-web-banner-template_70055-970.jpg?w=1380" style="width:100%; height: 100%px;">
        </div>

        <div class="mySlides fade">
            <img src="https://img.freepik.com/premium-psd/sport-sneakers-shoes-sale-social-media-facebook-web-banner-template_70055-1167.jpg?w=1380" style="width:100%">
        </div>

        <div class="mySlides fade">
            <img src="https://img.freepik.com/premium-psd/sport-sneakers-shoes-sale-social-media-instagram-post-facebook-web-banner-template_70055-909.jpg?w=1380" style="width:100%">
        </div>
    </div>

    <!-- The dots/circles -->
    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
        <span class="dot" onclick="currentSlide(4)"></span>
        <span class="dot" onclick="currentSlide(5)"></span>
    </div>

    <div class="search-box">
        <select class="form-control font-family" name="cateBegin" [(ngModel)]="selectedCategoryId"
            (change)="searchProduct()">
            <option [value]="0">Tất cả</option>
            <option *ngFor="let category of categories" [value]="category.id">
                {{category.name}}
            </option>
        </select>
        <input type="text" class="search-input" name="searchinpput" [(ngModel)]="keyword"
            placeholder="Tìm kiếm sản phẩm">
        <button type="button" class="login-button" (click)="searchProduct()">Tìm kiếm</button>
    </div>
    <div class="row">
        <div class="col-lg-3 col-md-6" *ngFor="let product of productResponses">
            <div class="product-item" (click)="onProductClick(product.id)">
                <img [src]="product.url" alt="Product Image" class="product-image">
                <div class="p-6">
                    <h5 class="product-name">
                        {{product.name}}
                    </h5>
                    <div class="flex">
                        <div class="col-md-7">
                            <div class="product-rating">
                                <i class="fa-solid fa-star color-star"></i>
                                <p class="product-description">4.9 (300 đánh giá)</p>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <p class="product-description blur-text textright">
                                Đã bán: 2k
                            </p>
                        </div>
                    </div>
                    <p class="product-description" style="margin-bottom: 0px; font-weight: 600; font-size: 18px;">
                        {{product.formattedPrice}}
                    </p>
                </div>
                <div class="button-active">
                    <button data-ripple-light="true" type="button" class="button-cart">
                        Thêm vào giỏ hàng
                    </button>
                    <button data-ripple-light="true" type="button" class="button">
                        Mua ngay
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <li class="page-item" *ngIf="currentPage > 1">
                    <a class="page-link" href="#" (click)="onPageChange(1)">
                        <<< </a>
                </li>
                <li class="page-item" *ngIf="currentPage > 1">
                    <a class="page-link" href="#" (click)="onPageChange(currentPage - 1)">
                        << </a>
                </li>
                <li class="page-item" *ngIf="currentPage > 3">
                    <a class="page-link">...</a>
                </li>
                <ng-container *ngFor="let page of visiblePages">
                    <li class="page-item" [ngClass]="{'active': page === currentPage}">
                        <a class="page-link" href="#" (click)="onPageChange(page)">{{ page }}</a>
                    </li>
                </ng-container>
                <li class="page-item" *ngIf="currentPage < 7">
                    <a class="page-link">...</a>
                </li>
                <li class="page-item" *ngIf="currentPage < totalPages">
                    <a class="page-link" href="#" (click)="onPageChange(currentPage + 1)">></a>
                </li>
                <li class="page-item" *ngIf="currentPage < totalPages">
                    <a class="page-link" href="#" (click)="onPageChange(totalPages)">>></a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<app-footer></app-footer>
